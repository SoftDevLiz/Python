{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sticky Notes{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Reenie+Beanie&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'notes/style.css' %}">
</head>
<body>
    <header>
        <h1>{% block header %}My Sticky Notes{% endblock %}</h1>
        <nav>
            <a href="{% url 'note_list' %}">View All</a> | 
            <a href="{% url 'note_create' %}">+ New Note</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
