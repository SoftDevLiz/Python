<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | eCommerce App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .login-container { max-width: 450px; margin-top: 100px; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .btn-primary { background-color: #6c63ff; border: none; padding: 10px; border-radius: 8px; }
        .btn-primary:hover { background-color: #5751d9; }
    </style>
</head>
<body>

<div class="container login-container">
    <div class="card p-4">
        <h2 class="text-center mb-4">Welcome Back</h2>
        
        {% if form.errors %}
            <div class="alert alert-danger">
                Your username and password didn't match. Please try again.
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        
        <div class="text-center mt-3">
            <small>New here? <a href="{% url 'register' %}">Create an account</a></small>
        </div>
        <div class="mt-3 text-center">
        <p class="small">
            <a href="{% url 'password_reset' %}" class="text-muted">Forgot your password?</a>
            </p>
        </div>
    </div>
</div>

</body>
</html>
