<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | eCommerce App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .register-container { max-width: 450px; margin-top: 80px; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .btn-primary { background-color: #6c63ff; border: none; padding: 10px; border-radius: 8px; }
        .btn-primary:hover { background-color: #5751d9; }
    </style>
</head>
<body>

<div class="container register-container">
    <div class="card p-4">
        <h2 class="text-center mb-4">Create Account</h2>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="e.g. Liz123" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Min 8 characters" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Account Type</label>
                <select name="role" class="form-select" required>
                    <option value="" selected disabled>Choose your role...</option>
                    <option value="Shoppers">Shopper (I want to buy)</option>
                    <option value="Sellers">Seller (I want to sell)</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100">Register Now</button>
        </form>
        
        <div class="text-center mt-3">
            <small>Already have an account? <a href="{% url 'login' %}">Login here</a></small>
        </div>
    </div>
</div>

</body>
</html>
