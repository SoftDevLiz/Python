<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit {{ product.name }} | EMPORIUM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background-color: #6c63ff; }
        .form-card { max-width: 600px; margin: 50px auto; border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .btn-update { background-color: #6c63ff; color: white; border: none; padding: 12px; }
        .btn-update:hover { background-color: #5751d9; color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">← Back to Dashboard</a>
    </div>
</nav>

<div class="container mt-3">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}
</div>

<div class="container">
    <div class="card form-card p-4">
        <h2 class="fw-bold mb-4">Edit Product</h2>
        
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Product Name</label>
                <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3">{{ product.description }}</textarea>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Price ($)</label>
                    <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Stock</label>
                    <input type="number" name="stock" class="form-control" value="{{ product.stock }}" required>
                </div>
            </div>
            <button type="submit" class="btn btn-update w-100 mt-3">Update Product Details</button>
        </form>

        <hr class="my-4">

        <div class="text-center">
            <p class="text-muted small">Danger Zone</p>
            <form action="{% url 'delete_product' product.id %}" method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-danger btn-sm" onclick="return confirm('Are you sure you want to permanently delete this product?')">
                    Delete This Product
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
